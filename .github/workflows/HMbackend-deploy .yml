# Deploy to an app on the Flex Consumption plan using OIDC authentication
name: Deploy Backend CRC

on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - "github/workflows/frontend-deploy.yml"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write


jobs:
    build-and-deploy:
      name: Build and deploy function app to Azure
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Azure Login
          uses: azure/login@v2
          with: 
            client-id: ${{vars.AZURE_BACKEND_CLIENT_ID}}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
         
        - name: 'Run the Azure Functions action'
          uses: Azure/functions-action@v1
          id: deploy-to-function-app
          with:
            app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
            package: '${{ vars._FUNCTIONAPP_PROJECT_PATH }}'   
